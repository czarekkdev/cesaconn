[workspace]
members = [
    "cesa_conn_crypto",
    "cesa_conn_networker", "cesa_conn_system",
    "cesa_conn_tui",
]
resolver = "3"

# integer overflow panics instead of wrapping silently, in release too
[profile.release]
overflow-checks = true

# Argon2 (64 MiB, 3 passes) is far too slow unoptimised; keep tests usable
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
