[package]
name = "cesa_conn_crypto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10.3"
# not direct users: only turn on wiping of the AES key schedule and the GHASH key
# when a cipher is dropped (off by default in RustCrypto)
aes = { version = "0.8.4", features = ["zeroize"] }
ghash = { version = "0.5.1", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
rand = "0.10.0"
zeroize = "1.8.2"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
argon2 = "0.5.3"
tracing = "0.1"
