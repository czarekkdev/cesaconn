[package]
name = "cesa_conn_networker"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cesa_conn_networker"
path = "src/cesa_conn_networker.rs"

[features]
# servertest / clienttest manual end-to-end commands; never in release builds
test-commands = []

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
cesa_conn_crypto = { path = "../cesa_conn_crypto" }
cesa_conn_system = { path = "../cesa_conn_system" }
tokio-util = "0.7.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8.2"
snow = "0.10.0"
rand = "0.10.1"
libcrux-ml-kem = "0.0.11"
spake2 = "0.4.0"
hkdf = "0.12.4"
blake2 = "0.10.6"
subtle = "2.6.1"
libcrux-ml-dsa = "0.0.11"

[target.'cfg(unix)'.dependencies]
# geteuid() without unsafe (the code-signature check is in cesa_conn_system)
nix = { version = "0.31.3", features = ["user"] }

[dev-dependencies]
# paused clock for lockout tests
tokio = { version = "1.50.0", features = ["full", "test-util"] }
